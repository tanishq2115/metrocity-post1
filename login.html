<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रतिनिधी लॉगिन | मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css?v=20260909-3"></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="index.html"><span>मेट्रोसिटी</span> <b>पोस्ट</b><small>तुमच्या शहराची, तुमच्या माणसांची बातमी</small></a><p class="red" style="margin-top:30px;font-size:10px;font-weight:800">NEWSROOM ACCESS</p><h1>प्रतिनिधी लॉगिन</h1><p style="color:#777;font-size:12px">बातमी तयार, मसुदा जतन आणि प्रकाशित करण्यासाठी प्रवेश करा.</p><form id="login-form"><label for="email">ई-मेल</label><input id="email" type="email" required autocomplete="username"><label for="password">पासवर्ड</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">लॉगिन करा →</button><p id="login-status" class="status"></p></form><p style="font-size:10px;margin-top:18px"><a class="red" href="index.html">← मुख्यपृष्ठावर जा</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=window.supabase.createClient(window.METROCITY_SUPABASE_URL,window.METROCITY_SUPABASE_KEY);const form=document.getElementById('login-form'),status=document.getElementById('login-status');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='लॉगिन तपासत आहे…';const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){status.textContent='ई-मेल किंवा पासवर्ड चुकीचा आहे.';return}const {data:p,error:pe}=await db.from('profiles').select('id,role').eq('id',data.user.id).maybeSingle();if(pe||!p){await db.auth.signOut();status.textContent='या खात्यासाठी प्रतिनिधी प्रोफाइल उपलब्ध नाही.';return}location.href='admin.html'});</script></body></html>
