<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रतिनिधी पॅनेल | मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css"></head><body><main class="admin-page"><header class="adminbar"><a class="logo" href="index.html"><span>मेट्रोसिटी</span> <b>पोस्ट</b></a><div><a href="index.html">साइट पहा ↗</a> <button id="logout">बाहेर पडा</button></div></header><section class="admin-wrap"><div class="admin-heading"><div><small>NEWSROOM</small><h1>नवीन बातमी</h1><p id="welcome">लॉगिन तपासत आहे…</p></div><span class="secure">🔐 सुरक्षित पॅनेल</span></div><form id="news-form" class="editor"><div class="editor-main"><label>मथळा *</label><input id="headline" required maxlength="180" placeholder="बातमीचा मुख्य मथळा"><label>उपमथळा</label><input id="subheadline" maxlength="300" placeholder="थोडक्यात सारांश"><div class="twocol"><div><label>विभाग *</label><select id="category" required><option value="">विभाग निवडा</option></select></div><div><label>ठिकाण</label><input id="location" placeholder="उदा. छत्रपती संभाजीनगर"></div></div><label>संपूर्ण बातमी *</label><textarea id="content" required rows="18" placeholder="मराठीत संपूर्ण बातमी लिहा. प्रत्येक परिच्छेद नवीन ओळीत लिहा."></textarea></div><aside class="editor-side"><label>मुख्य छायाचित्र</label><input id="photo" type="file" accept="image/*"><div id="preview" class="upload-preview">फोटो निवडल्यावर पूर्वदृश्य दिसेल</div><label>ई-पेपर मांडणी</label><select id="layout"><option value="auto">आपोआप निवडा</option><option value="photo-left">फोटो डावीकडे</option><option value="photo-right">फोटो उजवीकडे</option><option value="photo-top">फोटो वर</option><option value="photo-bottom">फोटो खाली</option><option value="no-photo">फोटोशिवाय</option><option value="two-column">दोन कॉलम</option><option value="three-column">तीन कॉलम</option></select><button class="primary" type="submit" id="publish">📰 बातमी प्रकाशित करा</button><button class="secondary" type="button" id="save-draft">मसुदा जतन करा</button><p id="status" class="form-status"></p></aside></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const {createClient}=window.supabase;const db=createClient(window.METROCITY_SUPABASE_URL,window.METROCITY_SUPABASE_KEY);let session=null,profile=null;const $=id=>document.getElementById(id);const status=$('status');
function slugify(s){return s.toLowerCase().trim().replace(/[^\u0900-\u097F\w\s-]/g,'').replace(/[\s_]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')||('news-'+Date.now());}
async function init(){const {data}=await db.auth.getSession();session=data.session;if(!session){location.href='login.html';return;}const {data:p,error}=await db.from('profiles').select('id,full_name,role').eq('id',session.user.id).maybeSingle();if(error||!p){await db.auth.signOut();location.href='login.html';return;}profile=p;$('welcome').textContent=`नमस्कार ${p.full_name} • ${p.role==='admin'?'प्रशासक':'प्रतिनिधी'}`;await loadCategories();}
async function loadCategories(){const {data}=await db.from('categories').select('id,name,slug').order('sort_order');if(data) data.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('category').appendChild(o);});}
$('photo').addEventListener('change',()=>{const f=$('photo').files[0];if(f){const u=URL.createObjectURL(f);$('preview').innerHTML=`<img src="${u}" alt="पूर्वदृश्य">`}});
async function uploadPhoto(file,userId){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${userId}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('news-images').upload(path,file,{cacheControl:'31536000',upsert:false});if(error)throw error;return db.storage.from('news-images').getPublicUrl(path).data.publicUrl;}
async function save(statusValue){status.textContent='जतन करत आहे…';$('publish').disabled=true;$('save-draft').disabled=true;try{const title=$('headline').value.trim(),content=$('content').value.trim();if(!title||!content)throw new Error('मथळा आणि बातमी आवश्यक आहे.');let imageUrl=null;const f=$('photo').files[0];if(f)imageUrl=await uploadPhoto(f,session.user.id);let slug=slugify(title);let {data:existing}=await db.from('news').select('id').eq('slug',slug).maybeSingle();if(existing)slug += '-'+Date.now().toString().slice(-6);const payload={slug,headline:title,subheadline:$('subheadline').value.trim()||null,content,category_id:$('category').value?Number($('category').value):null,location:$('location').value.trim()||null,reporter_id:session.user.id,main_image_url:imageUrl,epaper_layout:$('layout').value,status:statusValue,published_at:statusValue==='published'?new Date().toISOString():null,seo_title:title,seo_description:$('subheadline').value.trim()||title};const {data,error}=await db.from('news').insert(payload).select('slug').single();if(error)throw error;status.textContent=statusValue==='published'?'बातमी यशस्वीरीत्या प्रकाशित झाली!':'मसुदा जतन झाला!';if(statusValue==='published'&&data?.slug)setTimeout(()=>location.href='article.html?slug='+encodeURIComponent(data.slug),700);else document.getElementById('news-form').reset();}catch(e){status.textContent='अडचण: '+(e.message||'बातमी जतन झाली नाही.');}finally{$('publish').disabled=false;$('save-draft').disabled=false;}}
$('news-form').addEventListener('submit',e=>{e.preventDefault();save('published')});$('save-draft').addEventListener('click',()=>save('draft'));$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.href='login.html'});init();
</script></body></html>
