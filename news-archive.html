<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b40018"><title>लिखित बातम्या संग्रह | लोकमदत</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260917-lokmadat34"></head><body class="news-archive-page"><header class="site-header"><div class="masthead container"><button class="menu-btn archive-menu" id="archive-menu" type="button" aria-label="मेन्यू"><span></span><span></span><span></span></button><a class="lokmadat-logo" href="index.html" aria-label="लोकमदत मुख्यपृष्ठ"><img src="lokmadat-logo.png" alt="लोकमदत" class="lokmadat-logo-img"></a><div class="mast-actions"><a href="epaper.html" class="epaper-top">📰 ई-पेपर</a></div></div></header><main class="container archive-page-main"><div class="archive-page-head"><a href="index.html" class="back-link">← मुख्यपृष्ठ</a><span class="eyebrow">WRITTEN ARCHIVE</span><h1>लिखित बातम्यांचा संग्रह</h1><p>आजच्या आधी प्रकाशित झालेल्या सर्व लिखित बातम्या.</p></div><div id="archive-list" class="written-archive-grid"><div class="loading-box">बातम्या लोड होत आहेत…</div></div></main><nav class="bottom-category-nav"><div class="container bottom-nav-inner"><a href="index.html">मुख्यपृष्ठ</a><a class="active" href="news-archive.html">सर्व बातम्या</a><a href="epaper.html">ई-पेपर</a></div></nav><script src="supabase-config.js"></script><script>
(()=>{const API=`${window.METROCITY_SUPABASE_URL}/rest/v1`,KEY=window.METROCITY_SUPABASE_KEY,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),dateKey=v=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(v));const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`},time=v=>new Intl.DateTimeFormat('mr-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(v)),text=(v,n=120)=>{const s=String(v||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s},url=v=>{try{const u=new globalThis.URL(String(v||''),location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}},get=async p=>{const r=await fetch(API+p,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!r.ok)throw Error('load');return r.json()};async function init(){try{const rows=await get('/news?select=id,slug,headline,subheadline,content,location,main_image_url,published_at,created_at,epaper_layout,categories(name)&status=eq.published&order=published_at.desc.nullslast,created_at.desc.nullslast&limit=500');const today=dateKey(new Date());const list=rows.filter(r=>r.epaper_layout!=='direct-newspaper'&&dateKey(r.published_at||r.created_at)!==today);const box=$('#archive-list');box.innerHTML=list.length?list.map(r=>{const img=url(r.main_image_url);return `<article class="story-card"><a href="news.html?slug=${encodeURIComponent(r.slug||'')}"><div class="story-img ${img?'':'no-img'}">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:'📰'}</div><div class="story-content"><div class="story-meta"><span>${esc(r.categories?.name||'बातमी')}</span><time>${esc(time(r.published_at||r.created_at))}</time></div><h3>${esc(r.headline||'बातमी')}</h3><p>${esc(text(r.subheadline||r.content||''))}</p></div></a></article>`}).join(''):'<div class="loading-box">जुन्या लिखित बातम्या उपलब्ध नाहीत.</div>'}catch(e){console.error(e);$('#archive-list').innerHTML='<div class="error-box">बातम्या लोड करता आल्या नाहीत.</div>'}}document.addEventListener('DOMContentLoaded',init)})();</script></body></html>
