<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रतिनिधी लॉगिन | मेट्रोसिटी पोस्ट</title><link rel="stylesheet" href="styles.css"></head><body><main class="article auth"><section class="normal"><div class="logo"><span>मेट्रोसिटी</span> <b>पोस्ट</b></div><small>प्रतिनिधी विभाग</small><h2>प्रतिनिधी लॉगिन</h2><p>बातमी तयार आणि प्रकाशित करण्यासाठी आपल्या खात्यात प्रवेश करा.</p><form id="login-form"><label>ई-मेल</label><p><input id="email" type="email" required autocomplete="username" placeholder="तुमचा ई-मेल"></p><label>पासवर्ड</label><p><input id="password" type="password" required autocomplete="current-password" placeholder="पासवर्ड"></p><button class="primary" type="submit">लॉगिन करा →</button><p id="login-status" class="form-status"></p></form><p><a href="index.html" class="red">← मुख्यपृष्ठावर जा</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const {createClient}=window.supabase;const db=createClient(window.METROCITY_SUPABASE_URL,window.METROCITY_SUPABASE_KEY);const form=document.getElementById('login-form'),status=document.getElementById('login-status');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='लॉगिन तपासत आहे…';const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){status.textContent='ई-मेल किंवा पासवर्ड चुकीचा आहे.';return;}const {data:p}=await db.from('profiles').select('role,full_name').eq('id',data.user.id).maybeSingle();if(!p){await db.auth.signOut();status.textContent='या खात्यासाठी प्रतिनिधी प्रोफाइल उपलब्ध नाही.';return;}location.href='admin.html';});
</script></body></html>
