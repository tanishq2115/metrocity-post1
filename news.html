.news-site{background:#f7f7f6;color:#15171b;font-family:'Noto Sans Devanagari',system-ui,sans-serif;overflow-x:hidden}.news-site a{text-decoration:none;color:inherit}
.news-header{background:#fff;border-bottom:1px solid #dedfe1;position:sticky;top:0;z-index:50}.news-header-top{height:74px;display:grid;grid-template-columns:48px 1fr 105px;align-items:center;width:min(1200px,calc(100% - 28px));margin:auto}.news-menu{width:40px;height:40px;border:1px solid #d8d9dc;background:#fff;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}.news-menu span{display:block;width:18px;height:2px;background:#17191d;border-radius:2px}.news-logo{justify-self:center}.news-logo img{display:block;width:178px;height:auto;max-height:50px;object-fit:contain}.news-epaper{justify-self:end;border:1px solid #d0d2d5;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:900;white-space:nowrap}.news-epaper:hover{border-color:#c8001d;color:#c8001d}
.news-bottom-nav{background:#fff;border-top:1px solid #eee;border-bottom:1px solid #d8d9dc}.news-bottom-inner{width:min(1200px,calc(100% - 28px));margin:auto;display:flex;overflow-x:auto;scrollbar-width:none}.news-bottom-inner::-webkit-scrollbar{display:none}.news-bottom-inner a{padding:11px 17px 9px;font-size:14px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}.news-bottom-inner a.active,.news-bottom-inner a:hover{color:#c8001d;border-bottom-color:#c8001d}
.article-main{width:min(900px,calc(100% - 28px));margin:auto;padding:30px 0 65px}.article-main .crumb{font-size:12px;color:#74787d;margin-bottom:18px}.article-main .crumb a{color:#c8001d;font-weight:800}.normal-article{background:#fff;border:1px solid #e0e1e3;border-radius:16px;padding:36px 42px 46px;box-shadow:0 5px 24px rgba(0,0,0,.035)}.normal-article>.eyebrow{display:inline-flex;color:#c8001d;font-family:Arial,sans-serif;font-size:11px;font-weight:900;letter-spacing:1.5px;border-left:4px solid #c8001d;padding-left:9px;margin-bottom:13px}.normal-article h1{font-size:clamp(34px,5vw,58px);line-height:1.18;letter-spacing:-1.5px;margin:0 0 11px;font-weight:900;color:#111318}.article-subheadline{font-size:19px;line-height:1.62;color:#62676d;margin:0 0 17px;font-weight:500}.article-meta-row{display:flex;flex-wrap:wrap;gap:7px 12px;align-items:center;padding:13px 0 18px;border-top:1px solid #eee;border-bottom:1px solid #eee;color:#777c82;font-size:12px}.article-meta-row strong{color:#202329}.article-meta-dot{color:#c8001d;font-weight:900}
.article-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:25px 0 29px}.article-gallery figure{margin:0;overflow:hidden;background:#f0f1f2;border-radius:10px;border:1px solid #e5e6e8}.article-gallery figure:first-child{grid-column:1/-1}.article-gallery img{width:100%;height:auto;max-height:630px;display:block;object-fit:cover}.article-gallery figure:first-child img{max-height:590px}.article-gallery figcaption{font-size:11px;color:#777;padding:7px 10px;background:#fff}.article-body{font-size:19px;line-height:2;color:#292c31;max-width:790px;margin:auto}.article-body p{margin:0 0 20px}.article-body p:first-child::first-letter{font-size:50px;font-weight:900;float:left;line-height:.88;padding:7px 8px 0 0;color:#c8001d}

.loading,.empty,.error{background:#fff;border:1px solid #ddd;border-radius:14px;padding:45px;text-align:center;color:#777}
.news-footer{background:#111318;color:#fff}.news-footer-inner{width:min(1080px,calc(100% - 28px));margin:auto;padding:40px 0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.news-footer-brand img{width:145px;filter:brightness(0) invert(1);margin-bottom:8px}.news-footer-inner b{display:block;margin-bottom:8px}.news-footer-inner a,.news-footer-inner p{color:#c8cbd0;font-size:13px;margin:5px 0}.news-copyright{text-align:center;border-top:1px solid #292c31;color:#888;padding:11px;font-size:11px;background:#111318}
.news-drawer{position:fixed;inset:0;z-index:1000;visibility:hidden;pointer-events:none}.news-drawer.open{visibility:visible;pointer-events:auto}.news-drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:.2s}.news-drawer.open .news-drawer-backdrop{opacity:1}.news-drawer-panel{position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:#fff;padding:22px;transform:translateX(-100%);transition:.22s ease;box-shadow:10px 0 30px rgba(0,0,0,.18)}.news-drawer.open .news-drawer-panel{transform:translateX(0)}.news-drawer-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e2e4;padding-bottom:16px;font-size:22px}.news-drawer-head button{width:36px;height:36px;border:1px solid #ddd;background:#fff;border-radius:50%;font-size:22px}.news-drawer-links{display:flex;flex-direction:column}.news-drawer-links a{padding:16px 2px;border-bottom:1px solid #eee;font-weight:800}
@media(max-width:650px){.news-header-top{height:67px;width:calc(100% - 20px);grid-template-columns:42px 1fr 78px}.news-menu{width:38px;height:38px}.news-logo img{width:145px;max-height:44px}.news-epaper{font-size:9px;padding:8px 7px}.news-bottom-inner{width:100%}.news-bottom-inner a{font-size:12px;padding:10px 14px 8px}.article-main{width:100%;padding:16px 0 44px}.article-main .crumb{padding:0 14px;margin-bottom:12px}.normal-article{border:0;border-radius:0;box-shadow:none;padding:23px 14px 36px}.normal-article h1{font-size:34px;line-height:1.23;letter-spacing:-.8px}.article-subheadline{font-size:17px;line-height:1.6}.article-meta-row{font-size:11px;padding:11px 0 15px}.article-gallery{grid-template-columns:1fr;gap:8px;margin:19px -14px 24px}.article-gallery figure:first-child{grid-column:auto}.article-gallery img,.article-gallery figure:first-child img{max-height:none}.article-gallery figcaption{padding-left:14px}.article-body{font-size:17px;line-height:1.9}.article-body p:first-child::first-letter{font-size:44px}.article-share{grid-template-columns:1fr;margin-top:21px}.article-share button,.article-share a{width:100%}.news-footer-inner{grid-template-columns:1fr 1fr;padding:32px 0}.news-footer-inner>div:first-child{grid-column:1/-1}}
@media(max-width:380px){.news-header-top{grid-template-columns:40px 1fr 70px}.news-logo img{width:132px}.news-epaper{font-size:8px;padding:7px 6px}.normal-article h1{font-size:31px}}

<script src="supabase-config.js?v=20260910-home1"></script>
<script>
(()=>{const URL=window.METROCITY_SUPABASE_URL,KEY=window.METROCITY_SUPABASE_KEY,API=URL+'/rest/v1';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const get=async p=>{const r=await fetch(API+p,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`},cache:'no-store'});if(!r.ok)throw Error('load');return r.json()};const text=v=>String(v||'').replace(/\r\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();const date=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('mr-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}).format(d)};
const decodeShortKey=k=>{try{if(!k)return '';if(/^\d+$/.test(k))return k;if(!/^[A-Za-z0-9_-]{20,24}$/.test(k))return '';let b64=k.replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';const bin=atob(b64);if(bin.length!==16)return '';const h=[...bin].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`}catch{return ''}};
const shortKey=r=>{const id=String(r?.id||'');if(!id)return '';if(/^\d+$/.test(id))return id;const hex=id.replace(/-/g,'');if(!/^[0-9a-f]{32}$/i.test(hex))return '';let bin='';hex.match(/../g).forEach(h=>bin+=String.fromCharCode(parseInt(h,16)));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

function legacyCopy(value){const ta=document.createElement('textarea');ta.value=value;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}ta.remove();return ok}
async function copyShareLink(url,button){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);ok=true}}catch(e){}if(!ok)ok=legacyCopy(url);const old=button.textContent;if(ok){button.textContent='✓ लिंक कॉपी झाली';setTimeout(()=>button.textContent=old,1800)}else{button.textContent='कॉपी झाली नाही';setTimeout(()=>button.textContent=old,1800);window.prompt('लिंक कॉपी करण्यासाठी खालील लिंक निवडा:',url)}}
function shareToApps(url,title){if(navigator.share){navigator.share({title:title||'लोकमदत',text:title||'लोकमदत बातमी',url:url}).catch(()=>{});return}window.prompt('तुमच्या ब्राउझरमध्ये Share to Apps उपलब्ध नाही. ही लिंक कॉपी करा:',url)}
function shareToWhatsApp(url,title){const text=(title?title+'\n\n':'')+url;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')}

async function init(){const qs=new URLSearchParams(location.search);const slug=qs.get('slug');const key=qs.get('n');const id=decodeShortKey(key);if(!slug&&!id){$('#article-root').innerHTML='<div class="empty">बातमी सापडली नाही.</div>';return}try{const filter=id?`id=eq.${encodeURIComponent(id)}`:`slug=eq.${encodeURIComponent(slug)}`;const rows=await get(`/news?select=id,slug,headline,subheadline,content,location,main_image_url,published_at,created_at,epaper_layout,categories(name)&status=eq.published&${filter}&limit=1`);const n=rows?.[0];if(!n){$('#article-root').innerHTML='<div class="empty">ही बातमी उपलब्ध नाही.</div>';return}
const shareUrl=`https://eomqfssvcpczfazndezs.supabase.co/functions/v1/news-share?n=${encodeURIComponent(shortKey(n))}`;
const desc=text(n.content||'').slice(0,180);
document.title=(n.headline||'बातमी')+' | लोकमदत';
[['meta[property="og:title"]',n.headline||'लोकमदत'],['meta[property="og:description"]',desc||'लोकमदत — ताज्या बातम्या'],['meta[property="og:image"]',n.main_image_url||'lokmadat-logo.png'],['meta[name="twitter:title"]',n.headline||'लोकमदत'],['meta[name="twitter:description"]',desc||'लोकमदत — ताज्या बातम्या'],['meta[name="twitter:image"]',n.main_image_url||'lokmadat-logo.png']].forEach(([sel,val])=>{const m=document.querySelector(sel);if(m)m.setAttribute('content',val)});
let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=`${location.origin}${location.pathname}?n=${encodeURIComponent(shortKey(n))}`;if(n.epaper_layout==='direct-newspaper'){location.href='epaper.html';return}let photos=[];try{photos=await get(`/news_photos?select=image_url,sort_order&news_id=eq.${encodeURIComponent(n.id)}&order=sort_order.asc`)}catch(e){console.warn(e)}const urls=[n.main_image_url,...(photos||[]).map(x=>x.image_url)].filter(Boolean).filter((u,i,a)=>a.indexOf(u)===i);const gallery=urls.length?`<div class="article-gallery">${urls.map((u,i)=>`<figure><img src="${esc(u)}" alt="${esc(n.headline)}" loading="${i?'lazy':'eager'}">${urls.length>1?`<figcaption>फोटो ${i+1}</figcaption>`:''}</figure>`).join('')}</div>`:'';const paragraphs=text(n.content||'').split(/\n\s*\n|\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');document.title=(n.headline||'बातमी')+' | लोकमदत';

const safeTitle=JSON.stringify(n.headline||'लोकमदत');
$('#article-root').innerHTML=`<div class="crumb"><a href="index.html">मुख्यपृष्ठ</a> / ${esc(n.categories?.name||'बातमी')}</div><article class="normal-article"><span class="eyebrow">${esc(n.categories?.name||'बातमी')}</span><h1>${esc(n.headline||'बातमी')}</h1>${n.subheadline?`<p class="article-subheadline">${esc(n.subheadline)}</p>`:''}<div class="article-meta-row"><strong>लोकमदत वृत्तसेवा</strong><span class="article-meta-dot">•</span><span>${esc(date(n.published_at||n.created_at))}</span>${n.location?`<span class="article-meta-dot">•</span><span>${esc(n.location)}</span>`:''}</div>${gallery}<div class="body article-body">${paragraphs||'<p>या बातमीसाठी अतिरिक्त मजकूर उपलब्ध नाही.</p>'}</div><div class="article-share"><button type="button" class="share-primary" onclick="shareToApps(shareUrl,${safeTitle})">📤 Share to Apps</button><button type="button" class="share-whatsapp" onclick="shareToWhatsApp(shareUrl,${safeTitle})">🟢 Share to WhatsApp</button><button type="button" onclick="copyShareLink(shareUrl,this)">🔗 Copy Link</button><a href="index.html">← आणखी बातम्या</a></div></article>`}catch(e){console.error(e);$('#article-root').innerHTML='<div class="error">बातमी लोड करता आली नाही. कृपया पुन्हा प्रयत्न करा.</div>'}}

document.addEventListener('DOMContentLoaded',()=>{init();const d=document.getElementById('news-drawer'),o=document.getElementById('news-menu'),c=document.getElementById('news-close'),b=document.getElementById('news-drawer-backdrop');const t=v=>{d.classList.toggle('open',v);document.body.style.overflow=v?'hidden':''};o?.addEventListener('click',()=>t(true));c?.addEventListener('click',()=>t(false));b?.addEventListener('click',()=>t(false));d?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>t(false)))})()})();
</script>
